          # 3) visible name AyuGram -> JojoGram (text inside XML elements only, links are skipped)
          import glob, re
          pat = re.compile(r">([^<>]*AyuGram[^<>]*)<")
          def fix(m):
              t = m.group(1)
              if "http" in t or "t.me" in t or "github" in t.lower():
                  return m.group(0)
              return ">" + t.replace("AyuGram", "JojoGram") + "<"
          changed = 0
          for p in glob.glob("TMessagesProj/src/main/res/values*/*.xml"):
              s = open(p, encoding="utf-8").read()
              n = pat.sub(fix, s)
              if n != s:
                  open(p, "w", encoding="utf-8").write(n)
                  changed += 1
          print("renamed visible strings in", changed, "files")
