name: Fix JojoGram APK (no build)
# Downloads the APK from the last successful build, clears the "test-only" flag,
# signs it again and uploads it as JojoGram-APK-fixed. Nothing is compiled.
on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Download APK of the last successful build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "Build JojoGram APK" --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          echo "Using build run: $ID"
          gh run download "$ID" --repo "$GITHUB_REPOSITORY" -n JojoGram-APK -D in
          find in -name "*.apk" -exec ls -la {} \;

      - name: Clear test-only flag and sign
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          echo "build-tools: $BT"
          mkdir -p out
          echo '' | base64 -d > ks.jks
          cat > fix.py <<'PY_EOF'
          import struct, sys, zipfile

          # Clears android:testOnly in the binary AndroidManifest.xml of an APK.
          src, dst = sys.argv[1], sys.argv[2]
          RES_TESTONLY = 0x01010272
          zin = zipfile.ZipFile(src)
          data = bytearray(zin.read("AndroidManifest.xml"))

          def u16(o): return struct.unpack_from("<H", data, o)[0]
          def u32(o): return struct.unpack_from("<I", data, o)[0]

          if u16(0) != 0x0003:
              sys.exit("ERROR: AndroidManifest.xml is not binary XML")
          resmap, found, patched = [], False, 0
          pos = u16(2)
          total = min(u32(4), len(data))
          while pos + 8 <= total:
              t, hs, sz = u16(pos), u16(pos + 2), u32(pos + 4)
              if sz < 8:
                  break
              if t == 0x0180:
                  resmap = [u32(pos + hs + 4 * i) for i in range((sz - hs) // 4)]
              elif t == 0x0102:
                  base = pos + 16
                  attr_start, attr_size, attr_count = u16(base + 8), u16(base + 10), u16(base + 12)
                  for i in range(attr_count):
                      a = base + attr_start + i * attr_size
                      name = u32(a + 4)
                      if name < len(resmap) and resmap[name] == RES_TESTONLY:
                          found = True
                          if data[a + 15] == 0x12 and u32(a + 16) != 0:
                              struct.pack_into("<I", data, a + 16, 0)
                              patched += 1
              pos += sz

          print("testOnly attribute found:", found, "| cleared:", patched)
          skip = (".SF", ".RSA", ".DSA", ".EC")
          with zipfile.ZipFile(dst, "w") as zout:
              for item in zin.infolist():
                  n = item.filename
                  if n.startswith("META-INF/") and (n.endswith(skip) or n == "META-INF/MANIFEST.MF"):
                      continue
                  buf = bytes(data) if n == "AndroidManifest.xml" else zin.read(n)
                  zi = zipfile.ZipInfo(n, item.date_time)
                  zi.compress_type = item.compress_type
                  zi.external_attr = item.external_attr
                  zout.writestr(zi, buf)
          PY_EOF
          for f in $(find in -name "*.apk"); do
            b=$(basename "$f")
            echo "=== $b"
            echo "--- testOnly BEFORE:"
            $BT/aapt2 dump xmltree --file AndroidManifest.xml "$f" | grep -i "testOnly" || echo "(no testOnly attribute)"
            python3 fix.py "$f" tmp.apk
            $BT/zipalign -f -p 4 tmp.apk al.apk
            $BT/apksigner sign --ks ks.jks --ks-key-alias jojo --ks-pass pass:jojogram123 --key-pass pass:jojogram123 --out "out/$b" al.apk
            echo "--- testOnly AFTER:"
            $BT/aapt2 dump xmltree --file AndroidManifest.xml "out/$b" | grep -i "testOnly" || echo "(no testOnly attribute)"
            echo "--- signature:"
            $BT/apksigner verify --verbose "out/$b" 2>&1 | head -n 8
            rm -f tmp.apk al.apk
          done
          rm -f out/*.idsig
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: JojoGram-APK-fixed
          path: out/*.apk
          if-no-files-found: error
