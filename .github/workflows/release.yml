name: Build JojoGram APK
on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Create API_KEYS
        run: |
          {
            echo 'APP_ID = 6'
            echo 'APP_HASH = "eb06d4abfb49dc3eeb1aeb98ae0f581e"'
            echo 'MAPS_V2_API = none'
            echo 'SIGNING_KEY_STORE_PASSWORD = jojogram123'
            echo 'SIGNING_KEY_ALIAS = jojo'
            echo 'SIGNING_KEY_PASSWORD = jojogram123'
          } > API_KEYS

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build bison gcc make

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleAfatRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: JojoGram-APK
          path: TMessagesProj/build/outputs/apk/afat/release/*.apk
